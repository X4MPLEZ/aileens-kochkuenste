  @keyframes leoDrift{from{transform:translateY(0)}to{transform:translateY(-320px)}}
  /* weiche Lichtpunkte im Hintergrund */
  .bokeh{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bokeh i{position:absolute;border-radius:50%;filter:blur(18px);opacity:.55;animation:drift linear infinite}
  .bokeh i:nth-child(1){width:220px;height:220px;left:-60px;top:8%;background:#f8c9d6;animation-duration:26s}
  .bokeh i:nth-child(2){width:160px;height:160px;right:-40px;top:22%;background:#fde0cf;animation-duration:31s;animation-delay:-8s}
  .bokeh i:nth-child(3){width:260px;height:260px;left:30%;bottom:-90px;background:#f4d3df;animation-duration:36s;animation-delay:-15s}
  .bokeh i:nth-child(4){width:120px;height:120px;right:18%;bottom:18%;background:#fbe3c9;animation-duration:22s;animation-delay:-4s}
  .bokeh i:nth-child(5){width:90px;height:90px;left:12%;top:40%;background:#f7cbd9;animation-duration:28s;animation-delay:-20s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(24px,-30px) scale(1.08)}66%{transform:translate(-18px,18px) scale(.95)}100%{transform:translate(0,0) scale(1)}}

  header{position:relative;z-index:1;padding:calc(env(safe-area-inset-top) + 14px) 60px 6px;text-align:center}
  .admin.sound{right:auto;left:16px;font-size:15px}
  .admin{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.7);border:1px solid var(--rose-soft);display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:17px;box-shadow:0 4px 14px rgba(120,50,80,.08)}
  header h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:italic;font-size:30px;line-height:1.05;letter-spacing:.3px;color:var(--ink)}
  header h1 .heart{color:var(--rose);font-style:normal;font-size:22px;vertical-align:4px;margin-left:4px;display:inline-block;animation:beat 2.2s ease-in-out infinite}
  header p{color:var(--muted);font-size:13px;margin-top:3px;letter-spacing:.4px}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}56%{transform:scale(1)}}

  .track{position:relative;z-index:1;flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 0}
  .track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;opacity:.5;transform:scale(.9);will-change:transform,opacity}
  .pic{position:absolute;inset:0;will-change:transform}
  .frame{position:relative;width:var(--fw);height:var(--fh);border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(120,50,80,.25);border:5px solid #fff}
  .frame img{position:absolute;display:block;max-width:none;transform-origin:center;will-change:transform}
  .frame img.bg{inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(26px) saturate(1.15) brightness(.92)}
  .slide.active .frame img.main{animation:kenburns 10s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
  .shine{position:absolute;inset:0;z-index:2;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.38) 50%,transparent 65%);transform:translateX(-130%)}
  .slide.active .shine{animation:shine 1.4s ease-out .15s 1 both}
  @keyframes shine{from{transform:translateX(-130%)}to{transform:translateX(130%)}}
  .bar{position:absolute;top:10px;left:14px;right:14px;height:3px;background:rgba(255,255,255,.4);border-radius:3px;z-index:3}
  .bar i{display:block;height:100%;width:var(--p,0%);background:#fff;border-radius:3px;box-shadow:0 0 6px rgba(255,255,255,.8)}
  .badge{position:absolute;top:22px;left:14px;z-index:3;background:rgba(255,255,255,.85);color:var(--rose);font-size:11px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600;padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px)}
  .fav{display:inline-block;margin-bottom:9px;white-space:nowrap;background:linear-gradient(135deg,#f3d27a,#d9a66b 60%,#c98f52);color:#fff;font-size:9.5px;letter-spacing:.9px;text-transform:uppercase;font-weight:700;padding:5px 10px;border-radius:999px;box-shadow:0 6px 16px rgba(201,143,82,.4);text-shadow:0 1px 2px rgba(0,0,0,.2)}
  .meta{position:absolute;left:0;right:0;bottom:0;padding:96px 20px 20px;background:linear-gradient(to top,rgba(50,15,30,.74),rgba(50,15,30,0));color:#fff;z-index:3;opacity:0;transform:translateY(12px);transition:opacity .6s .2s,transform .6s .2s}
  .slide.active .meta{opacity:1;transform:none}
  .date{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#ffd8e2;font-weight:600}
  .time{opacity:.75;font-weight:400;letter-spacing:.5px}
  .caption{margin-top:6px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:23px;line-height:1.15;text-shadow:0 1px 8px rgba(0,0,0,.35)}
  .desc{margin-top:5px;font-size:13.5px;line-height:1.35;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.35)}
  .fh{position:fixed;z-index:20;pointer-events:none;color:var(--rose);font-size:22px;text-shadow:0 2px 8px rgba(196,96,122,.4)}
  #fx{position:fixed;inset:0;z-index:6;pointer-events:none}

  footer{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;padding:4px 20px calc(env(safe-area-inset-bottom) + 14px)}
  .buttons{display:flex;gap:10px}
  .count{position:absolute;top:22px;right:14px;z-index:3;background:rgba(255,255,255,.85);color:var(--ink);font-size:11px;letter-spacing:1px;font-weight:600;padding:5px 10px;border-radius:999px;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums}
  .count b{color:var(--rose)}
  button{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid var(--rose-soft);border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(120,50,80,.08)}
  button:active{transform:scale(.96)}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:40px;line-height:1.5;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-style:italic}

  /* Editor als Overlay – keine Seitennavigation, damit die Wisch-Gesten von iOS nichts auslösen */
  #adminPanel{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
  #adminPanel[hidden]{display:none}
  .panelbar{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 10px 8px 18px;color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:600;font-size:20px}
  .panelbar button{width:38px;height:38px;padding:0;border-radius:50%;font-size:18px;line-height:1}
  #adminPanel iframe{flex:1;border:0;width:100%;background:var(--bg)}
  /* Wisch-Hinweis beim ersten Öffnen */
  .hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);z-index:5;background:rgba(74,36,54,.82);color:#fff;padding:10px 16px 10px 14px;border-radius:999px;font-size:14px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(74,36,54,.3);backdrop-filter:blur(8px);opacity:0;transition:opacity .5s;pointer-events:none;white-space:nowrap}
  .hint.show{opacity:1}
  .hint .hand{display:inline-block;font-size:20px;animation:swipe 1.6s ease-in-out infinite}
  @keyframes swipe{0%,100%{transform:translateX(10px)}50%{transform:translateX(-10px)}}

  /* Startbildschirm */
  #cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;background:linear-gradient(160deg,#fbeef1,#f6dde6 60%,#fdeadf);transition:opacity .9s,visibility .9s;cursor:pointer;overflow:hidden}
  #cover.hide{opacity:0;visibility:hidden}
  #cover .c{position:relative;z-index:1}
  #cover .leo{position:absolute;opacity:.06}
  #cover .script{font-family:"Great Vibes",cursive;font-size:30px;color:var(--rose);margin-bottom:6px;animation:rise 1.2s .2s both}
  #cover h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:italic;font-size:44px;line-height:1.05;color:var(--ink);animation:rise 1.2s .5s both}
  #cover p{margin-top:14px;color:var(--muted);font-size:15px;letter-spacing:.3px;animation:rise 1.2s .8s both}
  #cover .thanks{font-family:"Great Vibes",cursive;font-size:64px;line-height:1;color:var(--rose);margin-top:26px;animation:rise 1.2s 1.1s both;text-shadow:0 6px 24px rgba(196,96,122,.25)}
  #cover .big{font-size:40px;color:var(--rose);margin:8px 0 14px;animation:beat 2.2s ease-in-out infinite,rise 1.2s 1.3s both}
  #cover small{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;animation:rise 1.2s 1.8s both}
  #cover .rh{position:absolute;bottom:-40px;color:var(--rose);opacity:0;animation:riseheart linear infinite;pointer-events:none}
  @keyframes riseheart{0%{transform:translateY(0) rotate(-8deg);opacity:0}10%{opacity:.55}90%{opacity:.35}100%{transform:translateY(-110vh) rotate(10deg);opacity:0}}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide.active .frame img.main,.bokeh i,.heart,.hint .hand,#cover .rh{animation:none}}
</style>
</head>
<body>
<div class="leo"></div>
<div class="bokeh"><i></i><i></i><i></i><i></i><i></i></div>

<div id="cover">
  <div class="leo"></div>
  <div class="c">
    <div class="script">mit Liebe gekocht</div>
    <h2 id="coverTitle"></h2>
    <p id="coverSub"></p>
    <div class="thanks" id="coverThanks"></div>
    <div class="big">♥</div>
    <small>Antippen</small>
  </div>
</div>

<header><h1><span id="title"></span><span class="heart">♥</span></h1><p id="subtitle"></p><a class="admin" id="adminLink" href="admin.html" title="Foto hinzufügen">📷</a><button class="admin sound" id="soundBtn" type="button">🔊</button></header>
<canvas id="fx"></canvas>
<div class="track" id="track"></div>
<div class="hint" id="hint"><span class="hand">👈</span><span>Nach links wischen</span></div>
<div id="adminPanel" hidden><div class="panelbar"><span>Fotos hinzufügen &amp; bearbeiten</span><button id="closeAdmin" aria-label="Schließen">✕</button></div></div>
<footer>
  <div class="buttons" id="buttons">
    <button id="first">Anfang</button>
    <button id="random">✨ Zufall</button>
    <button id="last">Neueste</button>
  </div>
</footer>

<script>
// ===== Hier anpassen =====
const TITLE = 'Aileens Kochkünste';
const subtitleText = (n, first) => n ? `${n} Gerichte seit dem ${first}` : 'Noch keine Bilder';
const coverText = n => n ? `${n} Mal hast du für mich gekocht.` : 'Hier entsteht etwas.';
const THANKS = 'Danke';   // großes Wort auf dem Startbildschirm
const FAVORITE_LABEL = 'Markus Lieblingsgericht';   // Band auf den markierten Fotos
const START_AT = 'first';      // 'first' = von Anfang an, 'last' = neuestes zuerst
const FRAME_RATIO = 9 / 16;    // Breite / Höhe des Rahmens (Handy-Hochformat)
// =========================

const fmtDate  = new Intl.DateTimeFormat('de-DE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtShort = new Intl.DateTimeFormat('de-DE', {day:'numeric', month:'long', year:'numeric'});
const fmtTime  = new Intl.DateTimeFormat('de-DE', {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const track = document.getElementById('track');
let photos = [], slides = [];

// Zugangsschlüssel aus der Adresse (…/#key=…) übernehmen – so hat auch die Home-Bildschirm-App ihn
try{
  const m = location.hash.match(/key=([^&]+)/);
  if (m){ const c = JSON.parse(localStorage.getItem('kochbuch_cfg') || '{}'); c.token = decodeURIComponent(m[1]); localStorage.setItem('kochbuch_cfg', JSON.stringify(c)); }
}catch(e){}
// App-Manifest nur für Android/Desktop; iOS nimmt die Meta-Tags und die aktuelle Adresse
if (!/iPhone|iPad|iPod/i.test(navigator.userAgent)){
  const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l);
}

// ---------- Klänge: synthetisch, leise, kurz ----------
let actx = null, master = null, noiseBuf = null;
const soundOn = () => { try{ return localStorage.getItem('kochbuch_sound') !== '0'; }catch(e){ return true; } };
function audioInit(){
  if (actx) return;
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  actx = new AC(); master = actx.createGain(); master.gain.value = .5; master.connect(actx.destination);
}
function ensure(){ if (!soundOn()) return false; audioInit(); if (!actx) return false; if (actx.state === 'suspended') actx.resume(); return true; }
function env(node, t0, a, d, peak){
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t0 + a); g.gain.exponentialRampToValueAtTime(.0001, t0 + a + d);
  node.connect(g); g.connect(master); return g;
}
function noise(){
  if (!noiseBuf){ const n = actx.sampleRate; noiseBuf = actx.createBuffer(1, n, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1; }
  const src = actx.createBufferSource(); src.buffer = noiseBuf; return src;
}
function tone(freq, t, a, d, peak, type = 'sine', detune = 0){
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(freq, t); o.detune.value = detune;
  env(o, t, a, d, peak); o.start(t); o.stop(t + a + d + .05);
}
let curWhoosh = null;
function whoosh(dir = 1, strength = 1){
  if (!ensure()) return;
  const t = actx.currentTime, dur = .7;
  // laufenden Windstoß weich ablösen, damit schnelle Wischfolgen nicht matschen
  if (curWhoosh){ try{ curWhoosh.gain.cancelScheduledValues(t); curWhoosh.gain.setValueAtTime(Math.max(curWhoosh.gain.value, .0001), t); curWhoosh.gain.exponentialRampToValueAtTime(.0001, t + .09); }catch(e){} }
  const src = noise(), lp = actx.createBiquadFilter(), hp = actx.createBiquadFilter();
  lp.type = 'lowpass'; lp.Q.value = .6;
  lp.frequency.setValueAtTime(220, t); lp.frequency.exponentialRampToValueAtTime(1400, t + .22); lp.frequency.exponentialRampToValueAtTime(260, t + dur);
  hp.type = 'highpass'; hp.frequency.value = 120;
  src.connect(hp); hp.connect(lp); let out = lp;
  if (actx.createStereoPanner){ const pn = actx.createStereoPanner(); pn.pan.setValueAtTime(-.6 * dir, t); pn.pan.linearRampToValueAtTime(.6 * dir, t + dur * .8); lp.connect(pn); out = pn; }
  const g = actx.createGain();
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(.012 * strength, t + .12);
  g.gain.setValueAtTime(.012 * strength, t + .24);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  out.connect(g); g.connect(master);
  src.start(t); src.stop(t + dur + .05);
  curWhoosh = g;
}
function snap(){}
function chime(){
  if (!ensure()) return;
  const t = actx.currentTime, f = [523.25, 587.33, 659.25, 783.99][Math.random() * 4 | 0];
  tone(f, t, .06, 1.4, .016); tone(f * 2, t, .08, .9, .004); tone(f * 1.5, t + .12, .08, 1.1, .007);
}
function openSound(){
  if (!ensure()) return;
  const t = actx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => { tone(f, t + i * .09, .05, 1.2, .018); tone(f * 2, t + i * .09, .05, .6, .004); });
}
function uiTick(){ if (!ensure()) return; tone(1300, actx.currentTime, .003, .045, .012); }

// Ton-Schalter oben links
const soundBtn = document.getElementById('soundBtn');
const paintSound = () => { soundBtn.textContent = soundOn() ? '🔊' : '🔇'; soundBtn.title = soundOn() ? 'Ton aus' : 'Ton an'; };
paintSound();
soundBtn.addEventListener('click', () => { try{ localStorage.setItem('kochbuch_sound', soundOn() ? '0' : '1'); }catch(e){} paintSound(); if (soundOn()) chime(); });

// Startbildschirm: aufsteigende Herzen, Tippen zum Starten
const cover = document.getElementById('cover');
for (let i = 0; i < 14; i++){
  const h = document.createElement('i');
  h.className = 'rh'; h.textContent = '♥';
  h.style.left = (4 + Math.random() * 92) + '%';
  h.style.fontSize = (12 + Math.random() * 22) + 'px';
  h.style.animationDuration = (9 + Math.random() * 9) + 's';
  h.style.animationDelay = (-Math.random() * 14) + 's';
  cover.appendChild(h);
}
cover.addEventListener('click', () => { audioInit(); openSound(); cover.classList.add('hide'); setTimeout(showHint, 600); });

// Gleiche Rechnung wie im Editor:
// Hochkant-Fotos füllen den Rahmen (leicht beschnitten), breite Fotos werden komplett gezeigt – mit weichem Hintergrund.
function layout(p, W, H){
  const w = p.w || 3, h = p.h || 4, c = p.crop || {};
  const fx = c.fx ?? .5, fy = c.fy ?? .5, z = Math.max(1, c.z || 1);
  const fill = (w / h) <= 0.8;
  const base = fill ? Math.max(W / w, H / h) : Math.min(W / w, H / h);
  const s = base * z, dw = w * s, dh = h * s;
  const left = dw <= W + .5 ? (W - dw) / 2 : Math.min(0, Math.max(W - dw, W / 2 - fx * dw));
  const top  = dh <= H + .5 ? (H - dh) / 2 : Math.min(0, Math.max(H - dh, H / 2 - fy * dh));
  return {dw, dh, left, top, fill};
}
function sizeFrames(){
  const availH = track.clientHeight - 20, availW = track.clientWidth - 40;
  const H = Math.max(200, Math.min(availH * .96, availW / FRAME_RATIO)), W = H * FRAME_RATIO;
  document.documentElement.style.setProperty('--fw', W + 'px');
  document.documentElement.style.setProperty('--fh', H + 'px');
  return {W: W - 10, H: H - 10}; // abzüglich Rahmenrand
}
function applyLayouts(){
  const {W, H} = sizeFrames();
  slides.forEach((s, i) => {
    const img = s.querySelector('img.main');
    const L = layout(photos[i], W, H);
    img.style.width = L.dw + 'px'; img.style.height = L.dh + 'px';
    img.style.left = L.left + 'px'; img.style.top = L.top + 'px';
  });
  update3d();
}
window.addEventListener('resize', applyLayouts);

// 3D-Effekt beim Wischen: Karten drehen sich leicht und die nächste lugt schon herein
let ticking = false;
function update3d(){
  ticking = false;
  const tw = track.clientWidth || 1, sl = track.scrollLeft;
  const cur = Math.round(sl / tw);
  for (let i = Math.max(0, cur - 2); i <= Math.min(slides.length - 1, cur + 2); i++){
    const off = (i * tw - sl) / tw, a = Math.min(1, Math.abs(off));
    slides[i].style.transform = `translateX(${off * 6}%) rotate(${off * 3}deg) scale(${1 - a * .1})`;
    slides[i].style.opacity = 1 - a * .5;
    const pic = slides[i].querySelector('.pic');
    if (pic) pic.style.transform = `translateX(${off * 10}%)`;
  }
}
track.addEventListener('scroll', () => {
  if (!ticking){ requestAnimationFrame(update3d); ticking = true; }
  if (track.scrollLeft > track.clientWidth * .5) hideHint(true);
}, {passive: true});

// Wisch-Hinweis nur beim ersten Mal
const hint = document.getElementById('hint');
let hintTimer = null;
function showHint(){
  if (slides.length < 2) return;
  let seen = false; try{ seen = !!localStorage.getItem('kochbuch_hint'); }catch(e){}
  if (seen) return;
  hint.classList.add('show');
  setTimeout(() => { track.scrollTo({left: 80, behavior: 'smooth'}); setTimeout(() => track.scrollTo({left: 0, behavior: 'smooth'}), 650); }, 900);
  hintTimer = setTimeout(() => hideHint(false), 9000);
}
function hideHint(remember){
  hint.classList.remove('show');
  clearTimeout(hintTimer);
  if (remember){ try{ localStorage.setItem('kochbuch_hint', '1'); }catch(e){} }
}

// Herzen beim Antippen eines Bildes
let pd = null;
track.addEventListener('pointerdown', e => { pd = {x: e.clientX, y: e.clientY}; }, {passive: true});
track.addEventListener('pointerup', e => {
  if (!pd || Math.hypot(e.clientX - pd.x, e.clientY - pd.y) > 8 || !e.target.closest('.frame')) { pd = null; return; }
  pd = null;
  chime();
  for (let i = 0; i < 7; i++){
    const h = document.createElement('i');
    h.className = 'fh'; h.textContent = '♥';
    h.style.left = e.clientX + 'px'; h.style.top = e.clientY + 'px';
    h.style.fontSize = (14 + Math.random() * 16) + 'px';
    document.body.appendChild(h);
    const dx = (Math.random() - .5) * 120, dy = 90 + Math.random() * 110;
    h.animate([{transform: 'translate(-50%,-50%) scale(.5)', opacity: 1}, {transform: `translate(calc(-50% + ${dx}px), calc(-50% - ${dy}px)) scale(1.2)`, opacity: 0}],
              {duration: 900 + Math.random() * 500, easing: 'cubic-bezier(.2,.6,.2,1)'}).onfinish = () => h.remove();
  }
});

// Funkelnde Partikel entlang des Fingers beim Wischen
const fx = document.getElementById('fx'), ctx = fx.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
let parts = [], raf = null, lastTouch = null;
function resizeFx(){ fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; fx.style.width = innerWidth + 'px'; fx.style.height = innerHeight + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
resizeFx(); window.addEventListener('resize', resizeFx);
const colors = ['#ffffff', '#ffd6e0', '#f6b8c8', '#f9dcc4', '#e8b26a', '#ffffff'];
function emit(x, y, vx, vy){
  for (let i = 0; i < 3; i++){
    parts.push({x: x + (Math.random() - .5) * 10, y: y + (Math.random() - .5) * 10,
      vx: (Math.random() - .5) * 1.4 - vx * .12, vy: (Math.random() - .5) * 1.4 - vy * .12 - .5,
      life: 1, decay: .014 + Math.random() * .02, r: 1.5 + Math.random() * 3,
      c: colors[Math.random() * colors.length | 0], star: Math.random() < .2, rot: Math.random() * Math.PI});
  }
  if (parts.length > 240) parts.splice(0, parts.length - 240);
  if (!raf) raf = requestAnimationFrame(tick);
}
function star(x, y, r, rot){
  ctx.beginPath();
  for (let i = 0; i < 8; i++){ const a = rot + i * Math.PI / 4, rr = i % 2 ? r * .38 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function tick(){
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  for (const p of parts){ p.x += p.vx; p.y += p.vy; p.vy -= .012; p.life -= p.decay; }
  parts = parts.filter(p => p.life > 0);
  for (const p of parts){
    ctx.fillStyle = p.c;
    ctx.globalAlpha = p.life * .35;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2 * p.life + .5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = Math.min(1, p.life * 1.2);
    if (p.star) star(p.x, p.y, p.r * 2 * p.life + .8, p.rot);
    else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life + .3, 0, Math.PI * 2); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  raf = parts.length ? requestAnimationFrame(tick) : null;
}
let samples = [];
function trail(x, y){
  if (!panel.hidden) return;
  if (lastTouch){
    const dx = x - lastTouch.x, dy = y - lastTouch.y, dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.min(12, Math.round(dist / 7)));
    for (let i = 1; i <= steps; i++) emit(lastTouch.x + dx * i / steps, lastTouch.y + dy * i / steps, dx / steps, dy / steps);
  } else emit(x, y, 0, 0);
  lastTouch = {x, y};
  samples.push({x, y, t: performance.now()}); if (samples.length > 4) samples.shift();
}
function release(){
  if (samples.length >= 2){
    const a = samples[0], b = samples[samples.length - 1], dt = Math.max(1, b.t - a.t);
    const vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt, speed = Math.hypot(vx, vy);   // px pro ms
    if (speed > .35 && panel.hidden){
      for (let i = 0; i < 16; i++) emit(b.x + Math.random() * 10, b.y + Math.random() * 10, vx * 18 * (1 + Math.random()), vy * 18 * (1 + Math.random()));
    }
  }
  lastTouch = null; samples = [];
}
document.addEventListener('touchstart', e => { const t = e.touches[0]; if (t){ lastTouch = null; samples = []; trail(t.clientX, t.clientY); } }, {passive: true});
document.addEventListener('touchmove', e => { const t = e.touches[0]; if (t) trail(t.clientX, t.clientY); }, {passive: true});
document.addEventListener('touchend', release, {passive: true});
document.addEventListener('touchcancel', release, {passive: true});
document.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' && e.buttons) trail(e.clientX, e.clientY); });
document.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') release(); });

// Kamera-Knopf öffnet den Editor als Overlay (kein Seitenwechsel)
const panel = document.getElementById('adminPanel');
function openAdmin(){
  const f = document.createElement('iframe'); f.id = 'adminFrame'; f.src = 'admin.html';
  panel.appendChild(f); panel.hidden = false;
}
function closeAdmin(){
  panel.hidden = true;
  const f = document.getElementById('adminFrame'); if (f) f.remove();
  load();
  [45, 100, 170].forEach(sec => setTimeout(load, sec * 1000)); // neue Bilder nachladen, sobald die Seite neu gebaut ist
}
document.getElementById('adminLink').addEventListener('click', e => { e.preventDefault(); openAdmin(); });
document.getElementById('closeAdmin').addEventListener('click', closeAdmin);
window.addEventListener('message', e => { if (e.data === 'kochbuch-close') closeAdmin(); });

function badgeFor(d){
  const t = new Date();
  if (d.getDate() !== t.getDate() || d.getMonth() !== t.getMonth()) return '';
  const y = t.getFullYear() - d.getFullYear();
  if (y === 0) return 'Heute';
  if (y === 1) return 'Heute vor einem Jahr';
  return `Heute vor ${y} Jahren`;
}

let lastJson = null, io = null, ready = false, lastActive = null;
async function load(){
  let txt = '';
  try{
    const r = await fetch('photos.json?v=' + Date.now(), {cache:'no-store'});
    if (r.ok) txt = await r.text();
  }catch(e){}
  if (txt === lastJson) return;
  lastJson = txt;
  try{ const j = JSON.parse(txt || '{"photos":[]}'); photos = Array.isArray(j) ? j : (j.photos || []); }catch(e){ photos = []; }
  photos.sort((a,b) => String(a.date).localeCompare(String(b.date)));
  if (io) io.disconnect();
  ready = false; lastActive = null;
  track.innerHTML = ''; slides = [];
  document.getElementById('buttons').style.display = '';

  document.getElementById('title').textContent = TITLE;
  document.getElementById('coverTitle').textContent = TITLE;
  document.getElementById('coverSub').textContent = coverText(photos.length);
  document.getElementById('coverThanks').textContent = THANKS;
  const first = photos[0] ? fmtShort.format(new Date(photos[0].date)) : '';
  document.getElementById('subtitle').textContent = subtitleText(photos.length, first);

  if (!photos.length){
    track.innerHTML = '<div class="empty">Noch keine Bilder.<br>Kommt bald.</div>';
    document.getElementById('buttons').style.display = 'none';
    return;
  }

  const frag = document.createDocumentFragment();
  photos.forEach((p, i) => {
    const d = new Date(p.date);
    const showTime = p.dateSource === 'exif' && p.showTime !== false;
    const fill = (p.w && p.h) ? (p.w / p.h) <= 0.8 : true;
    const title = p.caption || p.dish || '';
    const badge = badgeFor(d);
    const s = document.createElement('section');
    s.className = 'slide';
    s.dataset.i = i;
    s.innerHTML =
      `<div class="frame">
         <div class="pic">
           ${fill ? '' : '<img class="bg" loading="lazy" decoding="async" alt="">'}
           <img class="main" loading="lazy" decoding="async" alt="">
         </div>
         <div class="shine"></div>
         <div class="bar"><i style="--p:${((i + 1) / photos.length * 100).toFixed(1)}%"></i></div>
         ${badge ? `<div class="badge">${badge}</div>` : ''}
         <div class="count"><b>♥</b> ${i + 1} / ${photos.length}</div>
         <div class="meta">
           ${p.favorite ? `<div class="fav">★ ${esc(FAVORITE_LABEL)}</div>` : ''}
           <div class="date">${fmtDate.format(d)}${showTime ? ` <span class="time">· ${fmtTime.format(d)} Uhr</span>` : ''}</div>
           ${title ? `<div class="caption">${esc(title)}</div>` : ''}
           ${p.desc ? `<div class="desc">${esc(p.desc)}</div>` : ''}
         </div>
       </div>`;
    const img = s.querySelector('img.main');
    img.onload = () => { if (!p.w || !p.h){ p.w = img.naturalWidth; p.h = img.naturalHeight; applyLayouts(); } };
    img.src = p.file;
    const bg = s.querySelector('img.bg');
    if (bg) bg.src = p.file;
    frag.appendChild(s);
  });
  track.appendChild(frag);
  slides = [...track.children];
  applyLayouts();

  io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting){
        const idx = +e.target.dataset.i;
        if (ready && lastActive !== null && idx !== lastActive) whoosh(idx > lastActive ? 1 : -1, 1);
        lastActive = idx;
        e.target.classList.add('active');
      } else {
        e.target.classList.remove('active');
      }
    });
  }, {root: track, threshold: .6});
  slides.forEach(s => io.observe(s));
  setTimeout(() => { ready = true; }, 800);

  const go = (i, smooth = true) => slides[Math.max(0, Math.min(slides.length - 1, i))]
    .scrollIntoView({behavior: smooth ? 'smooth' : 'auto', inline: 'center', block: 'nearest'});
  const current = () => slides.findIndex(s => s.classList.contains('active'));

  document.getElementById('first').onclick  = () => { uiTick(); go(0); };
  document.getElementById('last').onclick   = () => { uiTick(); go(slides.length - 1); };
  document.getElementById('random').onclick = () => { uiTick(); let r; do { r = Math.floor(Math.random() * slides.length); } while (slides.length > 1 && r === current()); go(r); };
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(current() + 1);
    if (e.key === 'ArrowLeft')  go(current() - 1);
  });

  if (START_AT === 'last') go(slides.length - 1, false);
}
load();
</script>
</body>
</html>
