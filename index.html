<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>Aileens Kochkünste</title>
<style>
  :root{--bg:#14110f;--card:#1f1a17;--text:#f4ede6;--muted:#b9aa9c;--accent:#e8a87c;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
  header{padding:calc(env(safe-area-inset-top) + 18px) 20px 8px;text-align:center}
  header h1{font-size:22px;font-weight:600;letter-spacing:.2px}
  header p{color:var(--muted);font-size:14px;margin-top:4px}
  .track{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 22px 10px;opacity:.4;transform:scale(.88);transition:transform .5s cubic-bezier(.2,.7,.2,1),opacity .5s}
  .slide.active{opacity:1;transform:scale(1)}
  .frame{width:min(100%,440px,50vh);aspect-ratio:4/5;border-radius:22px;overflow:hidden;background:var(--card);box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .meta{margin-top:16px;text-align:center;min-height:56px;max-width:440px}
  .date{font-size:15px;color:var(--accent);font-weight:600}
  .time{color:var(--muted);font-weight:400}
  .caption{margin-top:6px;font-size:17px;line-height:1.35}
  footer{display:flex;flex-direction:column;align-items:center;gap:8px;padding:4px 20px calc(env(safe-area-inset-bottom) + 14px)}
  .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .buttons{display:flex;gap:10px}
  button{background:var(--card);color:var(--text);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:10px 18px;font:inherit;font-size:14px;cursor:pointer}
  button:active{transform:scale(.96)}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:40px;line-height:1.5}
</style>
</head>
<body>
<header><h1 id="title"></h1><p id="subtitle"></p></header>
<div class="track" id="track"></div>
<footer>
  <span class="count" id="count"></span>
  <div class="buttons">
    <button id="first">Anfang</button>
    <button id="random">Zufall</button>
    <button id="last">Neueste</button>
  </div>
</footer>
<script>
// ===== Hier anpassen =====
const TITLE = 'Aileens Kochkünste';
const subtitleText = (n, first) => n ? `${n} Gerichte seit dem ${first}` : 'Noch keine Bilder';
const START_AT = 'first'; // 'first' = Geschichte von Anfang an, 'last' = neuestes Bild zuerst
// =========================

const fmtDate  = new Intl.DateTimeFormat('de-DE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtShort = new Intl.DateTimeFormat('de-DE', {day:'numeric', month:'long', year:'numeric'});
const fmtTime  = new Intl.DateTimeFormat('de-DE', {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  let photos = [];
  try{
    const r = await fetch('photos.json?v=' + Date.now(), {cache:'no-store'});
    if (r.ok){ const j = await r.json(); photos = Array.isArray(j) ? j : (j.photos || []); }
  }catch(e){}
  photos.sort((a,b) => String(a.date).localeCompare(String(b.date)));

  document.getElementById('title').textContent = TITLE;
  const first = photos[0] ? fmtShort.format(new Date(photos[0].date)) : '';
  document.getElementById('subtitle').textContent = subtitleText(photos.length, first);

  const track = document.getElementById('track');
  if (!photos.length){
    track.innerHTML = '<div class="empty">Noch keine Bilder.<br>Kommt bald.</div>';
    document.querySelector('footer').style.visibility = 'hidden';
    return;
  }

  const frag = document.createDocumentFragment();
  photos.forEach((p, i) => {
    const d = new Date(p.date);
    const showTime = p.dateSource === 'exif' && p.showTime !== false;
    const s = document.createElement('section');
    s.className = 'slide';
    s.dataset.i = i;
    s.innerHTML =
      `<div class="frame"><img loading="lazy" decoding="async" alt=""></div>
       <div class="meta">
         <div class="date">${fmtDate.format(d)}${showTime ? ` <span class="time">· ${fmtTime.format(d)} Uhr</span>` : ''}</div>
         <div class="caption">${esc(p.caption || '')}</div>
       </div>`;
    s.querySelector('img').src = p.file;
    frag.appendChild(s);
  });
  track.appendChild(frag);

  const slides = [...track.children];
  const count = document.getElementById('count');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting){
        e.target.classList.add('active');
        count.textContent = `${+e.target.dataset.i + 1} / ${slides.length}`;
      } else {
        e.target.classList.remove('active');
      }
    });
  }, {root: track, threshold: .6});
  slides.forEach(s => io.observe(s));

  const go = (i, smooth = true) => slides[Math.max(0, Math.min(slides.length - 1, i))]
    .scrollIntoView({behavior: smooth ? 'smooth' : 'auto', inline: 'center', block: 'nearest'});
  const current = () => slides.findIndex(s => s.classList.contains('active'));

  document.getElementById('first').onclick  = () => go(0);
  document.getElementById('last').onclick   = () => go(slides.length - 1);
  document.getElementById('random').onclick = () => go(Math.floor(Math.random() * slides.length));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(current() + 1);
    if (e.key === 'ArrowLeft')  go(current() - 1);
  });

  if (START_AT === 'last') go(slides.length - 1, false);
}
load();
</script>
</body>
</html>
