<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbeef1">
<title>Aileens Kochkünste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fbeef1; --bg2:#f6dde6; --bg3:#fdeadf;
    --ink:#4a2436; --muted:#9a6b7c; --rose:#c4607a; --rose-soft:#e9b7c4; --gold:#d9a66b;
    --fw:300px; --fh:533px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg1);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  body{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none;background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);position:relative}

  /* weiche Lichtpunkte im Hintergrund */
  .bokeh{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .bokeh i{position:absolute;border-radius:50%;filter:blur(18px);opacity:.55;animation:drift linear infinite}
  .bokeh i:nth-child(1){width:220px;height:220px;left:-60px;top:8%;background:#f8c9d6;animation-duration:26s}
  .bokeh i:nth-child(2){width:160px;height:160px;right:-40px;top:22%;background:#fde0cf;animation-duration:31s;animation-delay:-8s}
  .bokeh i:nth-child(3){width:260px;height:260px;left:30%;bottom:-90px;background:#f4d3df;animation-duration:36s;animation-delay:-15s}
  .bokeh i:nth-child(4){width:120px;height:120px;right:18%;bottom:18%;background:#fbe3c9;animation-duration:22s;animation-delay:-4s}
  .bokeh i:nth-child(5){width:90px;height:90px;left:12%;top:40%;background:#f7cbd9;animation-duration:28s;animation-delay:-20s}
  @keyframes drift{0%{transform:translate(0,0) scale(1)}33%{transform:translate(24px,-30px) scale(1.08)}66%{transform:translate(-18px,18px) scale(.95)}100%{transform:translate(0,0) scale(1)}}

  header{position:relative;z-index:1;padding:calc(env(safe-area-inset-top) + 14px) 20px 6px;text-align:center}
  header h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:italic;font-size:30px;line-height:1.05;letter-spacing:.3px;color:var(--ink)}
  header h1 .heart{color:var(--rose);font-style:normal;font-size:22px;vertical-align:4px;margin-left:4px;display:inline-block;animation:beat 2.2s ease-in-out infinite}
  header p{color:var(--muted);font-size:13px;margin-top:3px;letter-spacing:.4px}
  @keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.18)}28%{transform:scale(1)}42%{transform:scale(1.12)}56%{transform:scale(1)}}

  .track{position:relative;z-index:1;flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding:10px 0}
  .track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;opacity:.35;transform:scale(.86) rotate(-1deg);transition:transform .6s cubic-bezier(.2,.75,.2,1),opacity .6s}
  .slide.active{opacity:1;transform:scale(1) rotate(0)}
  .frame{position:relative;width:var(--fw);height:var(--fh);border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 24px 60px rgba(120,50,80,.25),0 2px 0 rgba(255,255,255,.8) inset;border:5px solid #fff}
  .frame img{position:absolute;display:block;max-width:none;transform-origin:center;will-change:transform}
  .frame img.bg{inset:-12%;width:124%;height:124%;object-fit:cover;filter:blur(26px) saturate(1.15) brightness(.92)}
  .slide.active .frame img.main{animation:kenburns 10s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
  .bar{position:absolute;top:10px;left:14px;right:14px;height:3px;background:rgba(255,255,255,.4);border-radius:3px;z-index:2}
  .bar i{display:block;height:100%;width:var(--p,0%);background:#fff;border-radius:3px;box-shadow:0 0 6px rgba(255,255,255,.8)}
  .meta{position:absolute;left:0;right:0;bottom:0;padding:70px 20px 20px;background:linear-gradient(to top,rgba(50,15,30,.72),rgba(50,15,30,0));color:#fff;z-index:2;opacity:0;transform:translateY(12px);transition:opacity .6s .2s,transform .6s .2s}
  .slide.active .meta{opacity:1;transform:none}
  .date{font-size:12px;letter-spacing:1.6px;text-transform:uppercase;color:#ffd8e2;font-weight:600}
  .time{opacity:.75;font-weight:400;letter-spacing:.5px}
  .caption{margin-top:6px;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;line-height:1.2;text-shadow:0 1px 8px rgba(0,0,0,.35)}

  footer{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;padding:2px 20px calc(env(safe-area-inset-bottom) + 12px)}
  .count{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .count b{color:var(--rose);font-weight:600}
  .buttons{display:flex;gap:10px}
  button{background:rgba(255,255,255,.7);color:var(--ink);border:1px solid var(--rose-soft);border-radius:999px;padding:9px 18px;font:inherit;font-size:14px;cursor:pointer;backdrop-filter:blur(6px);box-shadow:0 4px 14px rgba(120,50,80,.08)}
  button:active{transform:scale(.96)}
  .admin{color:var(--muted);font-size:12px;text-decoration:none;border:1px solid rgba(196,96,122,.25);border-radius:999px;padding:5px 12px}
  .admin[hidden]{display:none}
  .empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:40px;line-height:1.5;font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-style:italic}

  /* Startbildschirm */
  #cover{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 30px;background:linear-gradient(160deg,#fbeef1,#f6dde6 60%,#fdeadf);transition:opacity .8s,visibility .8s;cursor:pointer}
  #cover.hide{opacity:0;visibility:hidden}
  #cover .script{font-family:"Great Vibes",cursive;font-size:30px;color:var(--rose);margin-bottom:6px;animation:rise 1.2s .2s both}
  #cover h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-style:italic;font-size:44px;line-height:1.05;color:var(--ink);animation:rise 1.2s .5s both}
  #cover p{margin-top:14px;color:var(--muted);font-size:15px;letter-spacing:.3px;animation:rise 1.2s .8s both}
  #cover .big{font-size:56px;color:var(--rose);margin:26px 0 10px;animation:beat 2.2s ease-in-out infinite,rise 1.2s 1.1s both}
  #cover small{color:var(--muted);font-size:12px;letter-spacing:2px;text-transform:uppercase;animation:rise 1.2s 1.6s both}
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.slide.active .frame img.main,.bokeh i,.heart{animation:none}}
</style>
</head>
<body>
<div class="bokeh"><i></i><i></i><i></i><i></i><i></i></div>

<div id="cover">
  <div class="script">mit Liebe gekocht</div>
  <h2 id="coverTitle"></h2>
  <p id="coverSub"></p>
  <div class="big">♥</div>
  <small>Antippen</small>
</div>

<header><h1><span id="title"></span><span class="heart">♥</span></h1><p id="subtitle"></p></header>
<div class="track" id="track"></div>
<footer>
  <span class="count" id="count"></span>
  <div class="buttons" id="buttons">
    <button id="first">Anfang</button>
    <button id="random">Zufall</button>
    <button id="last">Neueste</button>
  </div>
  <a class="admin" id="adminLink" href="admin.html">📷 Foto hinzufügen</a>
</footer>

<script>
// ===== Hier anpassen =====
const TITLE = 'Aileens Kochkünste';
const subtitleText = (n, first) => n ? `${n} Gerichte seit dem ${first}` : 'Noch keine Bilder';
const coverText = n => n ? `${n} Mal hast du für mich gekocht.` : 'Hier entsteht etwas.';
const START_AT = 'first';      // 'first' = von Anfang an, 'last' = neuestes zuerst
const FRAME_RATIO = 9 / 16;    // Breite / Höhe des Rahmens (Handy-Hochformat)
// =========================

const fmtDate  = new Intl.DateTimeFormat('de-DE', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtShort = new Intl.DateTimeFormat('de-DE', {day:'numeric', month:'long', year:'numeric'});
const fmtTime  = new Intl.DateTimeFormat('de-DE', {hour:'2-digit', minute:'2-digit'});
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

document.getElementById('cover').addEventListener('click', e => e.currentTarget.classList.add('hide'));

// Gleiche Rechnung wie im Editor:
// Hochkant-Fotos füllen den Rahmen (leicht beschnitten), breite Fotos werden komplett gezeigt – mit weichem Hintergrund.
function layout(p, W, H){
  const w = p.w || 3, h = p.h || 4, c = p.crop || {};
  const fx = c.fx ?? .5, fy = c.fy ?? .5, z = Math.max(1, c.z || 1);
  const fill = (w / h) <= 0.8;
  const base = fill ? Math.max(W / w, H / h) : Math.min(W / w, H / h);
  const s = base * z, dw = w * s, dh = h * s;
  const left = dw <= W + .5 ? (W - dw) / 2 : Math.min(0, Math.max(W - dw, W / 2 - fx * dw));
  const top  = dh <= H + .5 ? (H - dh) / 2 : Math.min(0, Math.max(H - dh, H / 2 - fy * dh));
  return {dw, dh, left, top, fill};
}

let photos = [], slides = [];
function sizeFrames(){
  const track = document.getElementById('track');
  const availH = track.clientHeight - 20, availW = track.clientWidth - 40;
  const H = Math.max(200, Math.min(availH, availW / FRAME_RATIO)), W = H * FRAME_RATIO;
  document.documentElement.style.setProperty('--fw', W + 'px');
  document.documentElement.style.setProperty('--fh', H + 'px');
  return {W: W - 10, H: H - 10}; // abzüglich Rahmenrand
}
function applyLayouts(){
  const {W, H} = sizeFrames();
  slides.forEach((s, i) => {
    const img = s.querySelector('img.main');
    const L = layout(photos[i], W, H);
    img.style.width = L.dw + 'px'; img.style.height = L.dh + 'px';
    img.style.left = L.left + 'px'; img.style.top = L.top + 'px';
  });
}
window.addEventListener('resize', applyLayouts);

async function load(){
  try{
    const r = await fetch('photos.json?v=' + Date.now(), {cache:'no-store'});
    if (r.ok){ const j = await r.json(); photos = Array.isArray(j) ? j : (j.photos || []); }
  }catch(e){}
  photos.sort((a,b) => String(a.date).localeCompare(String(b.date)));

  document.getElementById('title').textContent = TITLE;
  document.getElementById('coverTitle').textContent = TITLE;
  document.getElementById('coverSub').textContent = coverText(photos.length);
  const first = photos[0] ? fmtShort.format(new Date(photos[0].date)) : '';
  document.getElementById('subtitle').textContent = subtitleText(photos.length, first);

  const track = document.getElementById('track');
  if (!photos.length){
    track.innerHTML = '<div class="empty">Noch keine Bilder.<br>Kommt bald.</div>';
    document.getElementById('buttons').style.display = 'none';
    return;
  }

  const frag = document.createDocumentFragment();
  photos.forEach((p, i) => {
    const d = new Date(p.date);
    const showTime = p.dateSource === 'exif' && p.showTime !== false;
    const fill = (p.w && p.h) ? (p.w / p.h) <= 0.8 : true;
    const s = document.createElement('section');
    s.className = 'slide';
    s.dataset.i = i;
    s.innerHTML =
      `<div class="frame">
         ${fill ? '' : '<img class="bg" loading="lazy" decoding="async" alt="">'}
         <img class="main" loading="lazy" decoding="async" alt="">
         <div class="bar"><i style="--p:${((i + 1) / photos.length * 100).toFixed(1)}%"></i></div>
         <div class="meta">
           <div class="date">${fmtDate.format(d)}${showTime ? ` <span class="time">· ${fmtTime.format(d)} Uhr</span>` : ''}</div>
           ${p.caption ? `<div class="caption">${esc(p.caption)}</div>` : ''}
         </div>
       </div>`;
    const img = s.querySelector('img.main');
    img.onload = () => { if (!p.w || !p.h){ p.w = img.naturalWidth; p.h = img.naturalHeight; applyLayouts(); } };
    img.src = p.file;
    const bg = s.querySelector('img.bg');
    if (bg) bg.src = p.file;
    frag.appendChild(s);
  });
  track.appendChild(frag);
  slides = [...track.children];
  applyLayouts();

  const count = document.getElementById('count');
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting){
        e.target.classList.add('active');
        count.innerHTML = `<b>♥</b> ${+e.target.dataset.i + 1} / ${slides.length}`;
      } else {
        e.target.classList.remove('active');
      }
    });
  }, {root: track, threshold: .6});
  slides.forEach(s => io.observe(s));

  const go = (i, smooth = true) => slides[Math.max(0, Math.min(slides.length - 1, i))]
    .scrollIntoView({behavior: smooth ? 'smooth' : 'auto', inline: 'center', block: 'nearest'});
  const current = () => slides.findIndex(s => s.classList.contains('active'));

  document.getElementById('first').onclick  = () => go(0);
  document.getElementById('last').onclick   = () => go(slides.length - 1);
  document.getElementById('random').onclick = () => go(Math.floor(Math.random() * slides.length));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(current() + 1);
    if (e.key === 'ArrowLeft')  go(current() - 1);
  });

  if (START_AT === 'last') go(slides.length - 1, false);
}
load();
</script>
</body>
</html>
